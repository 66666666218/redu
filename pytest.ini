# 测试发现范围。
#
# **为什么必须有这个文件**(2026-10-04):README 写的命令是 `python -m pytest -q`,
# 而在本机它会去收集 `tools/MediaCrawler/**`(那是 gitignore 的独立克隆,
# 自带 pytest 用例与自己的 conftest)→ 6 个 collection error 直接 Interrupted,
# **一个测试都没跑**,但退出码仍是 0、输出末尾只有几行报错 ——
# 看起来"跑过了",实际是**绿色的假运行**。这正是本项目反复踩的"静默失败"同类。
#
# 限定 `testpaths = tests` 后,`pytest -q` 与 `pytest tests -q` 行为一致(992 个用例)。
[pytest]
testpaths = tests
norecursedirs = tools .venv venv node_modules data frontend .git
