# 热点监控平台 · 多租户容器编排
# 服务:
#   mysql      数据库(用户/Cookie/各用户监控数据,均按 user_id 隔离)
#   redu-api   平台后端 FastAPI + 前端 SaaS(http://IP:8080/,注册登录后各管各的 Cookie)
# 运行:
#   cp .env.example .env   # 设 JWT_SECRET(强随机)、DATABASE_URL、SMTP 等
#   docker compose up -d

services:
  mysql:
    image: mysql:8.0
    container_name: redu-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: redu
      MYSQL_USER: redu
      MYSQL_PASSWORD: redu
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-redu_root_change_me}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redu-api:
    # 新镜像(多租户平台)需重新构建/推送;此处用本地构建
    # image: crpi-me8okzjl211xpvun.cn-hangzhou.personal.cr.aliyuncs.com/tcdhouhuayuan/redu:latest
    build: .
    container_name: redu-api
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.platform:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://redu:redu@mysql:3306/redu?charset=utf8mb4
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz',timeout=5)"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mysql_data:
