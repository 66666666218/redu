# 热点监控平台 · 多租户容器编排
# 服务:
#   mysql      数据库(用户/Cookie/各用户监控数据,均按 user_id 隔离)
#   redu-api   平台后端 FastAPI + 前端 SaaS(http://IP:8080/,注册登录后各管各的 Cookie)
#              调度器已内嵌在本进程(按各用户设置的频率采集),**不需要**单独的调度容器。
#              早期版本另有一个 redu-monitor 调度容器,现已废弃——继续跑会重复采集,请删除。
# 运行:
#   cp .env.example .env   # 必须设 JWT_SECRET(强随机 ≥32 字节),否则重启后登录态全部失效
#   docker compose up -d
#   curl -s http://127.0.0.1:8080/healthz   # 看 db.connected 是否为 true

services:
  mysql:
    image: mysql:8.0
    container_name: redu-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: redu
      MYSQL_USER: redu
      MYSQL_PASSWORD: redu
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-redu_root_change_me}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redu-api:
    # 从阿里云 ACR 拉取镜像;pull_policy: always 保证每次 up 都重新拉取(同名 latest 也会更新)
    image: crpi-me8okzjl211xpvun.cn-hangzhou.personal.cr.aliyuncs.com/tcdhouhuayuan/redu:latest
    pull_policy: always
    # 如需本地源码构建(调试),取消下面注释并把上面 image 注释掉
    # build: .
    container_name: redu-api
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "app.platform:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    environment:
      # 显式注入,避免落到默认值;主机名必须与上面的服务名 mysql 一致
      DATABASE_URL: mysql+pymysql://redu:redu@mysql:3306/redu?charset=utf8mb4
    volumes:
      # 日志/快照与 Cookie 文件(多租户下 Cookie 存库,此处仅留兼容与归档用)
      - ./data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz',timeout=5)"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mysql_data:
